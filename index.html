<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a06">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍄 Грибник-Лудоман</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  margin:0;font-family:'Segoe UI',system-ui,sans-serif;
  background:#050a06;color:#e8f0e8;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  position:fixed;inset:0;
}
.wrap{
  display:flex;flex-direction:column;
  height:100vh;
  height:100dvh;   /* динамическая высота под мобильные браузеры */
  width:100%;
  position:relative;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ================= HUD ================= */
.hud{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:6px 8px;
  background:linear-gradient(180deg,#0e1a12,#0a130d);
  border-bottom:2px solid #1e3524;z-index:20;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
  flex-shrink:0;
  min-height:46px;
}
.hud-left{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;overflow:hidden}
.coin{
  font-size:14px;font-weight:800;color:#ffd75e;
  text-shadow:0 0 10px rgba(255,200,60,.45);letter-spacing:.3px;
  padding:3px 8px;border-radius:7px;background:rgba(255,200,60,.06);
  border:1.5px solid rgba(255,200,60,.15);
  flex-shrink:0;
}
.coin.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.stat{font-size:10.5px;color:#8fae94;letter-spacing:.2px;white-space:nowrap;display:none}
.stat b{color:#cfe8cf;font-size:11px}
.stat.show-mobile{display:inline}
.pity{
  display:flex;align-items:center;gap:5px;font-size:10px;color:#8fae94;
  flex-shrink:0;margin-left:auto;
}
.pity-bar{
  width:70px;height:7px;border-radius:4px;background:#0b120d;
  border:1px solid #24382a;overflow:hidden;flex-shrink:0;
}
.pity-bar i{
  display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,#b45cff,#ffb020,#ff3b3b);
  transition:width .25s;
}
.lvl-badge{
  display:flex;align-items:center;gap:4px;
  font-size:11px;color:#e8d0ff;font-weight:800;
  padding:3px 8px;border-radius:7px;
  background:linear-gradient(180deg,rgba(180,92,255,.15),rgba(180,92,255,.05));
  border:1.5px solid rgba(180,92,255,.3);
  cursor:pointer;transition:.15s;
  white-space:nowrap;
  flex-shrink:0;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
.lvl-badge .icn{font-size:13px;flex-shrink:0}

/* ================= FIELD ================= */
.field{
  position:relative;flex:1;overflow:hidden;cursor:crosshair;
  isolation:isolate;min-height:0;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, #16351f 0%, transparent 65%),
    radial-gradient(ellipse 100% 60% at 50% 115%, #1c4026 0%, transparent 70%),
    linear-gradient(180deg,#07120b 0%,#0b1a10 45%,#12291a 100%);
}
.field::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(78deg, transparent 0 22px, rgba(60,140,80,.10) 22px 24px),
    repeating-linear-gradient(-72deg, transparent 0 31px, rgba(40,110,60,.09) 31px 33px);
}
.trees{position:absolute;top:0;left:0;right:0;height:110px;pointer-events:none;z-index:1}
.tree{
  position:absolute;bottom:0;width:0;height:0;
  border-left:30px solid transparent;border-right:30px solid transparent;
  border-bottom:100px solid #06110a;filter:blur(.4px);
}
.tree.s{border-left-width:20px;border-right-width:20px;border-bottom-color:#08150c}
.tree.xs{border-left-width:14px;border-right-width:14px;border-bottom-color:#0a1a0f}

.fly{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#d9ff8a;box-shadow:0 0 10px 2px rgba(190,255,110,.7);
  pointer-events:none;animation:fly 9s ease-in-out infinite;
}
@keyframes fly{
  0%,100%{transform:translate(0,0);opacity:.15}
  25%{transform:translate(35px,-55px);opacity:.95}
  50%{transform:translate(-25px,-100px);opacity:.35}
  75%{transform:translate(55px,-40px);opacity:.9}
}

/* ================= MUSHROOM ================= */
.mush{
  position:absolute;width:72px;height:80px;cursor:pointer;
  transform:translate(-50%,-100%) scale(var(--s,1));
  transform-origin:bottom center;
  transition:filter .15s;
  animation:spawnIn .45s cubic-bezier(.2,1.6,.5,1) backwards;
  /* увеличенная зона тапа */
  padding:0;
  touch-action:manipulation;
}
@keyframes spawnIn{from{opacity:0;transform:translate(-50%,-100%) scale(.2)}}
.mush-inner{width:100%;height:100%;transition:transform .16s ease;position:relative}
.mush:active .mush-inner{transform:translateY(-2px) scale(1.02)}
.msvg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.mush.casting{animation:shake .18s linear infinite}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-3px}75%{margin-left:3px}}
.mush.escape{transition:transform .6s ease-in, opacity .6s;transform:translate(120px,-100%) scale(.4) rotate(30deg);opacity:0}
.mush.fleeing{transition:left .55s cubic-bezier(.4,1.4,.5,1), top .55s cubic-bezier(.4,1.4,.5,1), filter .3s}
.mush.fleeing .msvg{animation:hop .55s ease}
@keyframes hop{
  0%{transform:translateY(0) scale(1)}
  40%{transform:translateY(-24px) scale(1.08)}
  100%{transform:translateY(0) scale(1)}
}

.mush.eyes{
  cursor:default;
  pointer-events:auto;
}
.mush.eyes .msvg{
  filter:drop-shadow(0 0 14px rgba(255,220,80,.6)) drop-shadow(0 6px 8px rgba(0,0,0,.55));
  animation:eyesGlow 2.4s ease-in-out infinite alternate;
}
@keyframes eyesGlow{
  from{filter:drop-shadow(0 0 10px rgba(255,220,80,.4)) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
  to{filter:drop-shadow(0 0 22px rgba(255,220,80,.85)) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
}
.mush.eyes.puffing .msvg{animation:eyesGlow 2.4s ease-in-out infinite alternate, puff .6s ease}
@keyframes puff{
  0%{transform:scale(1)}
  30%{transform:scale(1.18) rotate(-3deg)}
  100%{transform:scale(1)}
}

/* ================= SLUG ================= */
.slug{
  position:absolute;width:70px;height:42px;
  transform:translate(-50%,-50%);
  transform-origin:center center;
  pointer-events:none;
  z-index:4;
  animation:spawnIn .5s ease backwards;
}
.slug .ssvg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.slug.leaving{transition:transform .8s ease-in, opacity .8s;opacity:0;transform:translate(-50%,-50%) scale(.4)}

/* Speech bubble */
.speech-bubble{
  position:absolute;
  bottom:calc(100% + 4px);left:50%;
  transform:translateX(-50%);
  background:#fff8e7;color:#1a1010;
  padding:6px 9px;border-radius:10px;
  font-size:10.5px;font-weight:800;
  max-width:160px;text-align:center;line-height:1.25;
  box-shadow:0 4px 14px rgba(0,0,0,.5), 0 0 0 2px #ffdb70;
  pointer-events:none;z-index:5;opacity:0;
  letter-spacing:.2px;
}
.speech-bubble.show{animation:bubbleIn .35s cubic-bezier(.2,1.6,.5,1) forwards}
.speech-bubble::after{
  content:'';position:absolute;top:100%;left:50%;
  transform:translateX(-50%);
  border:7px solid transparent;border-top-color:#fff8e7;border-bottom:0;
}
@keyframes bubbleIn{
  from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.7)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}

/* ================= SPIT ================= */
.spit-glob{
  position:absolute;
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe58a, #e0a020 60%, #a05a10);
  box-shadow:0 0 16px rgba(255,200,60,.8), 0 0 8px rgba(255,120,0,.6);
  pointer-events:none;
  z-index:8;
  transform:translate(-50%,-50%);
  transition:left .55s cubic-bezier(.4,0,.6,1), top .55s cubic-bezier(.4,0,.6,1);
}
.spit-splat{
  position:absolute;
  width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,220,110,.75) 0%, rgba(180,120,30,.35) 45%, transparent 70%);
  pointer-events:none;
  z-index:7;
  transform:translate(-50%,-50%) scale(0);
  animation:splatAnim .8s ease-out forwards;
}
@keyframes splatAnim{
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1.4);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}
}

/* ================= CAST BAR ================= */
.cast{
  position:fixed;left:50%;
  bottom:calc(82px + env(safe-area-inset-bottom));
  width:min(300px,84vw);
  transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;
  transition:.18s;z-index:500;
}
.cast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cast-label{
  font-size:12px;text-align:center;margin-bottom:5px;color:#d6f0d9;
  text-shadow:0 2px 8px #000;font-weight:700;letter-spacing:.3px;
}
.cast-bar{
  height:20px;border-radius:5px;background:rgba(4,8,5,.9);
  border:2px solid #33512f;position:relative;overflow:hidden;
  box-shadow:0 0 24px rgba(0,0,0,.8), inset 0 0 12px rgba(0,0,0,.9);
}
#castFill{
  display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(180deg,#9dffb8 0%,#38c46a 45%,#1c7a3f 100%);
  box-shadow:0 0 16px rgba(80,255,140,.6), inset 0 0 10px rgba(255,255,255,.25);
  transition:width .06s linear;position:relative;
}
#castFill::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,transparent 0 12px,rgba(255,255,255,.22) 12px 20px);
  animation:stripes .6s linear infinite;
}
@keyframes stripes{to{background-position:34px 0}}

/* ================= DOCK ================= */
.dock{
  display:flex;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  justify-content:center;align-items:stretch;
  background:linear-gradient(0deg,#0e1a12,#0a130d);
  border-top:2px solid #1e3524;z-index:20;
  box-shadow:0 -4px 20px rgba(0,0,0,.6);
  flex-shrink:0;
}
.dock-btn-wrap{position:relative;display:inline-flex;flex:1;max-width:80px}
.dock-btn{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:6px 4px;width:100%;min-height:56px;
  border-radius:11px;background:linear-gradient(180deg,#1d3324,#12211a);
  border:2px solid #2c4a34;cursor:pointer;color:#cfe8cf;
  font-family:inherit;letter-spacing:.2px;transition:.15s;
  touch-action:manipulation;
}
.dock-btn:active:not(:disabled){transform:scale(.96);filter:brightness(1.1)}
.dock-btn:disabled{opacity:.35;cursor:not-allowed}
.dock-btn .icn{
  font-size:20px;line-height:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.55));
}
.dock-btn .lbl{
  font-size:9px;font-weight:800;letter-spacing:.2px;
  text-transform:uppercase;
}
.dock-btn .sub{font-size:8.5px;font-weight:700;opacity:.75}
.dock-btn .badge{
  position:absolute;top:-5px;right:-3px;
  background:linear-gradient(180deg,#ff5a5a,#c01a1a);
  color:#fff;border-radius:10px;padding:1px 5px;
  font-size:9px;font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.5), 0 0 8px rgba(255,60,60,.5);
  border:1.5px solid #2a0a0a;
  min-width:16px;text-align:center;
}
.dock-btn.gold{
  border-color:#6b5320;color:#ffd75e;
  background:linear-gradient(180deg,#332a12,#1d180a);
}
.dock-btn.danger{
  border-color:#6b2a2a;color:#ffb3b3;
  background:linear-gradient(180deg,#33161a,#1d0e11);
}
.dock-btn.purple{
  border-color:#4a2e6e;color:#dcc5ff;
  background:linear-gradient(180deg,#2a1d3a,#1a1224);
}
.dock-sep{
  width:1px;background:linear-gradient(180deg,transparent,#2c4a34 30%,#2c4a34 70%,transparent);
  align-self:stretch;margin:2px 0;flex-shrink:0;
}

/* ================= MODALS ================= */
.modal-back{
  position:fixed;inset:0;background:rgba(2,5,3,.78);backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;opacity:0;pointer-events:none;transition:.2s;
  padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
}
.modal-back.show{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:420px;max-height:calc(100dvh - 40px);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#16241a,#0b130d);
  border:2px solid #2f4a35;border-radius:16px;padding:14px;
  box-shadow:0 24px 70px #000, 0 0 60px rgba(70,255,130,.08);
  transform:scale(.9) translateY(14px);transition:.28s cubic-bezier(.2,1.5,.5,1);
}
.modal-back.show .modal{transform:scale(1) translateY(0)}
.modal h2{
  margin:0 0 10px;font-size:15px;letter-spacing:2.5px;text-align:center;
  color:#9fe8b3;text-shadow:0 0 16px rgba(90,255,140,.4);font-weight:800;
}

/* PROFILE */
.modal.prof{
  background:
    radial-gradient(ellipse at top, rgba(180,92,255,.12), transparent 60%),
    linear-gradient(180deg,#1c1424,#0e0812);
  border-color:#4a2e6e;
  box-shadow:0 24px 70px #000, 0 0 60px rgba(180,92,255,.15);
}
.modal.prof h2{color:#dcc5ff;text-shadow:0 0 16px rgba(180,92,255,.5)}
.prof-avatar{
  width:70px;height:70px;margin:2px auto 8px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;line-height:1;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.15), transparent 70%),
             linear-gradient(180deg,#2a1d3a,#140b1e);
  border:3px solid #8a5cc0;
  box-shadow:0 0 30px rgba(180,92,255,.5), inset 0 0 20px rgba(180,92,255,.3);
  flex-shrink:0;
}
.prof-title{
  text-align:center;font-size:17px;font-weight:900;letter-spacing:1px;
  color:#ffd75e;text-shadow:0 0 20px rgba(255,190,60,.5);
  margin-bottom:3px;
}
.prof-desc{
  text-align:center;font-size:11px;color:#b8a8c8;
  margin-bottom:12px;font-style:italic;
}
.prof-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  margin-bottom:12px;
}
.prof-stat{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(180,92,255,.15);
  border-radius:9px;padding:7px 9px;
  display:flex;flex-direction:column;gap:2px;
}
.prof-stat .lbl{
  font-size:9.5px;color:#8fae94;letter-spacing:.3px;
  text-transform:uppercase;font-weight:700;
}
.prof-stat .val{
  font-size:14px;font-weight:900;color:#e8d0ff;
  text-shadow:0 0 10px rgba(180,92,255,.4);
}
.prof-stat .val.gold{color:#ffd75e;text-shadow:0 0 10px rgba(255,190,60,.4)}
.prof-stat .val.green{color:#7bf0a4;text-shadow:0 0 10px rgba(90,255,140,.4)}

.titles-h{
  margin:6px 0 8px;font-size:11px;letter-spacing:2px;
  color:#9fe8b3;font-weight:800;text-align:center;
  text-transform:uppercase;
}
.titles-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
  gap:6px;overflow-y:auto;padding-right:4px;
  max-height:190px;-webkit-overflow-scrolling:touch;
}
.titles-grid::-webkit-scrollbar{width:5px}
.titles-grid::-webkit-scrollbar-thumb{background:#4a2e6e;border-radius:3px}
.title-chip{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 4px;border-radius:9px;
  background:rgba(255,255,255,.03);
  border:1.5px solid rgba(180,92,255,.15);
  text-align:center;
  transition:.15s;
}
.title-chip.locked{opacity:.35;filter:grayscale(80%)}
.title-chip.unlocked{
  background:linear-gradient(180deg,rgba(180,92,255,.12),rgba(180,92,255,.04));
  border-color:rgba(180,92,255,.5);
  box-shadow:0 0 14px rgba(180,92,255,.2);
}
.title-chip.current{
  border-color:#ffd75e;
  background:linear-gradient(180deg,rgba(255,190,60,.15),rgba(255,190,60,.05));
  box-shadow:0 0 18px rgba(255,190,60,.4);
}
.title-chip .t-icn{font-size:19px;line-height:1}
.title-chip .t-name{
  font-size:10px;font-weight:800;letter-spacing:.2px;
  color:#dcc5ff;line-height:1.15;
}
.title-chip.current .t-name{color:#ffd75e}
.title-chip .t-req{
  font-size:9px;color:#8fae94;font-weight:600;
}

#closeProfBtn{
  margin-top:10px;padding:12px;border-radius:10px;
  border:1.5px solid #4a2e6e;
  background:linear-gradient(180deg,#241a30,#170f20);
  color:#c8b8d8;font-size:12px;font-weight:800;letter-spacing:1.5px;
  cursor:pointer;font-family:inherit;transition:.15s;
  text-transform:uppercase;
  flex-shrink:0;
  touch-action:manipulation;
}
#closeProfBtn:active{border-color:#8a5cc0;color:#e0d0f0;transform:scale(.98)}

/* BOTTOM SHEET */
.sheet-back{
  position:fixed;inset:0;background:rgba(2,5,3,.78);backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  z-index:9999;opacity:0;pointer-events:none;transition:.25s;
}
.sheet-back.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  max-height:88vh;max-height:88dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1c1424,#0e0812);
  border-top:2px solid #4a2e6e;
  border-radius:18px 18px 0 0;
  padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:.35s cubic-bezier(.2,1.1,.5,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.7), 0 0 80px rgba(180,92,255,.15);
}
.sheet-back.show .sheet{transform:translateY(0)}
.sheet-handle{
  width:40px;height:4px;border-radius:2px;
  background:#4a2e6e;margin:0 auto 8px;
  box-shadow:0 0 8px rgba(180,92,255,.4);
  flex-shrink:0;
}
.sheet-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;flex-shrink:0;
}
.sheet-header h2{
  margin:0;font-size:14px;letter-spacing:2px;
  color:#dcc5ff;text-shadow:0 0 16px rgba(180,92,255,.5);
  font-weight:800;
}
.sheet-close{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(180,92,255,.3);
  color:#dcc5ff;font-size:14px;font-weight:800;
  cursor:pointer;transition:.15s;
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;
  touch-action:manipulation;
  flex-shrink:0;
}
.sheet-close:active{background:rgba(255,60,60,.15);border-color:#c94a4a;color:#ffb3b3;transform:scale(.92)}

/* LOOT LIST */
.loot{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:6px;
  padding-right:2px;min-height:40px;flex:1;
}
.loot::-webkit-scrollbar{width:5px}
.loot::-webkit-scrollbar-thumb{background:#2c4a34;border-radius:3px}
.loot-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  background:rgba(255,255,255,.035);border-left:4px solid #666;
  animation:lootIn .4s cubic-bezier(.2,1.6,.5,1) backwards;
  flex-shrink:0;
}
@keyframes lootIn{from{opacity:0;transform:translateX(-22px) scale(.9)}}
.li-icon{
  font-size:22px;line-height:1;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;
  background:rgba(0,0,0,.3);
  filter:drop-shadow(0 0 8px currentColor);
  flex-shrink:0;
}
.li-info{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.inv-stats{

.modal-total{
  text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:#ffd75e;

#takeBtn, #sellAllBtn{
  margin-top:10px;padding:12px;border-radius:10px;border:2px solid #4f8a5e;
  background:linear-gradient(180deg,#2a8f4d,#186331);color:#eaffe9;

  font-family:inherit;transition:.15s;
  touch-action:manipulation;
  flex-shrink:0;

/* TOASTS */
.toasts{
  position:fixed;left:8px;right:8px;
  bottom:calc(78px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:5px;
  z-index:10000;pointer-events:none;
  max-width:min(320px,72vw);
}
.toast{
  padding:7px 11px;border-radius:8px;font-size:11.5px;font-weight:600;
  background:rgba(10,22,14,.94);border-left:3px solid #4f8a5e;color:#c8e6cc;
  box-shadow:0 6px 20px rgba(0,0,0,.6);animation:toastIn .3s ease backwards;
  line-height:1.3;
}
.toast.out{animation:toastOut .4s ease forwards}
.toast.steal{background:rgba(40,6,10,.95);border-left-color:#ff3b3b;color:#ffc5c5}
.toast.critic{background:rgba(40,32,6,.95);border-left-color:#ffd75e;color:#ffeeb0;font-style:italic}
.toast.slug{background:rgba(28,10,38,.95);border-left-color:#b06ad0;color:#e0c8f0}
@keyframes toastIn{from{opacity:0;transform:translateX(-26px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-26px)}}

.flash{position:fixed;inset:0;pointer-events:none;z-index:10001;animation:flashAnim .8s ease-out forwards}
@keyframes flashAnim{0%{opacity:1}100%{opacity:0}}
.shake{animation:screenShake .5s ease}
@keyframes screenShake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-6px,4px)}
  40%{transform:translate(5px,-5px)}
  60%{transform:translate(-4px,-3px)}
  80%{transform:translate(3px,3px)}
}

@media (orientation: portrait){

let actx = null;
function beep(freq, dur=0.08, type='sine', vol=0.035){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function raritySound(r){
  const map = { common:[220,'triangle'], uncommon:[330,'triangle'], rare:[440,'sine'],
    epic:[660,'sine'], legendary:[880,'sine'], mythic:[1100,'sawtooth'] };
  const [f,t] = map[r] || [300,'sine'];
  beep(f, .12, t, .05);
  if(r==='legendary'||r==='mythic'){
    setTimeout(()=>beep(f*1.5,.16,'sine',.05),110);
    setTimeout(()=>beep(f*2,.22,'sine',.05),230);
  }
}

function weightedPick(weights){
  let total = 0;
  for(const k in weights) total += weights[k];
  let r = Math.random()*total;
  for(const k in weights){
    r -= weights[k];
    if(r <= 0) return k;
  }
  return Object.keys(weights)[0];
}

function invTotalCount(){
  let n = 0;
  for(const k in state.inventory) n += state.inventory[k].count;
  return n;
}
function invTotalValue(){
  let v = 0;
  for(const k in state.inventory) v += state.inventory[k].count * state.inventory[k].value;
  return v;
}
function updateHud(){
  coinsEl.textContent = fmt(state.coins);
  if(picksEl) picksEl.textContent = fmt(state.picks);
  if(bestEl){
    bestEl.textContent = state.best ? state.best : '—';
    bestEl.style.color = state.bestColor;
  }

  const cur = getCurrentTitle();
  lvlEl.textContent = cur.name;
  lvlIcon.textContent = cur.icon;

  if(state.coins > state.maxCoins) state.maxCoins = state.coins;

  const total = invTotalCount();
  if(total > 0){
    invBadge.style.display = '';
    invBadge.textContent = total > 99 ? '99+' : total;
  } else {
    invBadge.style.display = 'none';
  }

  const p = Math.min(state.pity, PITY_MAX);
  pityFill.style.width = (p/PITY_MAX*100) + '%';
  pityNum.textContent  = p + '/' + PITY_MAX;

  checkTitleUnlock();
}
function addCoins(n){
  state.coins += n;
  if(state.coins > state.maxCoins) state.maxCoins = state.coins;
  updateHud();
  coinBox.classList.remove('pop');
  void coinBox.offsetWidth;
  coinBox.classList.add('pop');
}
function invKey(item){ return item.name + '|' + item.rarity; }
function addToInventory(item){
  const k = invKey(item);
  if(state.inventory[k]) state.inventory[k].count++;
  else state.inventory[k] = { ...item, count: 1 };
  state.everOwned[k] = true;
  updateHud();
}
function renderInventory(){
  invList.innerHTML = '';
  const entries = Object.entries(state.inventory);
  const total = invTotalCount();
  const value = invTotalValue();

  if(entries.length === 0){
    invStats.innerHTML = 'Рюкзак пуст…';
    const d = document.createElement('div');
    d.className = 'empty-msg';
    d.innerHTML = '🎒 <b>Пусто.</b><br><span style="font-size:11px;opacity:.6">Собери грибы — лут появится здесь.</span>';
    invList.appendChild(d);
    sellAllBtn.disabled = true;
    sellAllBtn.textContent = '💰 ПРОДАТЬ ВСЁ';
    return;
  }

  invStats.innerHTML = `Предметов: <b>${fmt(total)}</b> · Ценность: <b>${fmt(value)} $</b>`;

  entries.sort((a,b) => {
    const ra = RARITY_ORDER.indexOf(a[1].rarity);
    const rb = RARITY_ORDER.indexOf(b[1].rarity);
    if(ra !== rb) return rb - ra;
    return b[1].value - a[1].value;
  });

  entries.forEach(([key, it]) => {
    const el = document.createElement('div');
    el.className = 'inv-item';
    el.style.borderLeftColor = RARITY[it.rarity].color;
    el.innerHTML = `
      <div class="li-icon" style="color:${RARITY[it.rarity].color}">${it.icon}</div>
      <div class="li-info">
        <div class="li-name" style="color:${RARITY[it.rarity].color}">${it.name}</div>
        <div class="li-rar" style="color:${RARITY[it.rarity].color}">${RARITY[it.rarity].name}</div>
      </div>
      <div class="inv-count">×${it.count}</div>
      <button class="sell-btn" data-key="${key}">+${fmt(it.value)} $</button>`;
    invList.appendChild(el);
  });

  sellAllBtn.disabled = false;
  sellAllBtn.textContent = `💰 ПРОДАТЬ ВСЁ (+${fmt(value)} $)`;

  invList.querySelectorAll('.sell-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      sellFromInventory(btn.dataset.key, 1);
      beep(700, .05, 'triangle', .03);
    });
  });
}
function sellFromInventory(key, n){
  const it = state.inventory[key];
  if(!it) return 0;
  const amount = Math.min(n, it.count);
  const gained = amount * it.value;
  state.coins += gained;
  it.count -= amount;
  if(it.count <= 0) delete state.inventory[key];
  updateHud(); renderInventory();
  return gained;
}
function sellAllInventory(){
  const value = invTotalValue();
  if(value <= 0) return 0;
  state.inventory = {};
  state.coins += value;
  updateHud(); renderInventory();
  return value;
}

const MAX_REGULAR_MUSHROOMS = 10;
let mushrooms = [];
let eyesMushroom = null;

function countRegular(){ return mushrooms.filter(m => !m.isEyes).length; }

function spawnMushroom(){
  if(state.modalOpen) return;
  if(countRegular() >= MAX_REGULAR_MUSHROOMS) return;

  const id = ++state.mushId;
  // На телефоне — более ограниченные отступы, чтобы грибы не уходили под док
  const small = window.innerWidth < 500;
  const xMin = small ? 12 : 10, xMax = small ? 88 : 90;
  const yMin = small ? 22 : 26, yMax = small ? 86 : 88;

  const x = rnd(xMin, xMax);
  const y = rnd(yMin, yMax);
  const hue = Math.random() < 0.72 ? rnd(0, 48) : rnd(0, 360);

  const el = document.createElement('div');
  el.className = 'mush';
  el.style.left = x + '%';
  el.style.top  = y + '%';
  el.style.setProperty('--s', (0.7 + y/100*0.5).toFixed(2));
  el.style.zIndex = Math.round(y * 0.25) + 2;
  el.style.animationDelay = (Math.random()*0.15)+'s';
  el.innerHTML = `<div class="mush-inner">${mushroomSVG(hue, id)}</div>`;

  const m = { id, el, x, y, isEyes: false, fleeing: false };

  el.addEventListener('click', ev => {
    ev.stopPropagation();
    if(state.modalOpen) return;
    if(m.fleeing) return;
    startCast(m);
  });

  field.appendChild(el);
  mushrooms.push(m);
}

function spawnEyesMushroom(){
  if(state.modalOpen) return;
  if(eyesMushroom) return;
  if(document.querySelector('.mush.eyes')) return;

  const id = ++state.mushId;
  const small = window.innerWidth < 500;

  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if(edge === 0){        x = rnd(16, 84); y = rnd(24, 32); }
  else if(edge === 1){   x = rnd(16, 84); y = rnd(80, 86); }
  else if(edge === 2){   x = rnd(10, 15); y = rnd(36, 76); }
  else {                 x = rnd(85, 90); y = rnd(36, 76); }

  const el = document.createElement('div');
  el.className = 'mush eyes';
  el.style.left = x + '%';
  el.style.top  = y + '%';
  el.style.setProperty('--s', (0.7 + y/100*0.5).toFixed(2));
  el.style.zIndex = Math.round(y * 0.25) + 2;
  el.innerHTML = `<div class="mush-inner">${eyesSVG(id)}<div class="speech-bubble" data-eye-bubble></div></div>`;

  const m = { id, el, x, y, isEyes: true, bubbleTimer: null, spitTimer: null, commentTimer: null };

  el.addEventListener('click', ev => {
    ev.stopPropagation();
    if(state.modalOpen) return;
    eyesCriticizeNow(m);
  });

  field.appendChild(el);
  mushrooms.push(m);
  eyesMushroom = m;

  startEyesCriticism(m);
  startEyesSpit(m);

  toast('👁️ На поляне появился глазастый гриб.', '#ffd75e');
}

function removeMushroom(m, fade, escapeClass){
  const i = mushrooms.indexOf(m);
  if(i >= 0) mushrooms.splice(i, 1);
  if(m === eyesMushroom) eyesMushroom = null;
  if(m.bubbleTimer){ clearTimeout(m.bubbleTimer); m.bubbleTimer = null; }
  if(m.commentTimer){ clearTimeout(m.commentTimer); m.commentTimer = null; }
  if(m.spitTimer){ clearTimeout(m.spitTimer); m.spitTimer = null; }

  if(fade){
    m.el.classList.add(escapeClass || 'escape');
    setTimeout(()=> m.el.remove(), 950);
  } else {
    m.el.remove();
  }
}

function mushroomFlee(m, sourceLabel){
  if(m.fleeing) return;
  if(m.isEyes) return;
  if(cast && cast.m === m) return;

  m.fleeing = true;
  let nx, ny, attempts = 0;
  do {
    nx = rnd(14, 86);
    ny = rnd(26, 84);
    attempts++;
  } while (attempts < 8 && Math.hypot(nx - m.x, ny - m.y) < 20);

  m.x = nx; m.y = ny;
  m.el.classList.add('fleeing');
  m.el.style.left = nx + '%';
  m.el.style.top  = ny + '%';
  m.el.style.setProperty('--s', (0.7 + ny/100*0.5).toFixed(2));
  m.el.style.zIndex = Math.round(ny * 0.25) + 2;

  state.mushroomsFled++;
  updateHud();

  setTimeout(() => {
    if(!document.body.contains(m.el)) return;
    m.el.classList.remove('fleeing');
    m.fleeing = false;
  }, 600);

  if(sourceLabel && Math.random() < 0.35){
    toast(`💨 ${sourceLabel}`, '#b06ad0', 'slug');
  }
}

function startEyesCriticism(m){
  const bubble = m.el.querySelector('[data-eye-bubble]');
  if(!bubble) return;

  function showBubble(){
    if(!document.body.contains(m.el)) return;
    bubble.textContent = pick(EYES_CRITICISM);
    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
    if(Math.random() < 0.5) criticSound();
    state.criticsReceived++;
    updateHud();
    setTimeout(() => {
      if(!document.body.contains(m.el)) return;
      bubble.classList.remove('show');
    }, 4000);
  }

  m.commentTimer = setTimeout(function loop(){
    showBubble();
    m.commentTimer = setTimeout(loop, 10000);
  }, 3000 + Math.random()*3000);
}

function eyesCriticizeNow(m){
  const bubble = m.el.querySelector('[data-eye-bubble]');
  const line = pick(EYES_CRITICISM);
  if(bubble){
    bubble.textContent = line;
    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
    setTimeout(()=> bubble.classList.remove('show'), 3000);
  }
  toast('👁️ «' + line + '»', '#ffd75e', 'critic');
  criticSound();
  state.criticsReceived++;
  updateHud();
}

function startEyesSpit(m){
  function loop(){
    if(!document.body.contains(m.el)) return;
    if(mushrooms.length > 1){
      eyesSpit(m);
      state.spitsReceived++;
      updateHud();
    }
    m.spitTimer = setTimeout(loop, 22000 + Math.random()*16000);
  }
  m.spitTimer = setTimeout(loop, 12000 + Math.random()*8000);
}

function eyesSpit(eyesM){
  const targets = mushrooms.filter(x => x !== eyesM && !x.isEyes);
  if(targets.length === 0) return;

  const fromX = eyesM.x, fromY = eyesM.y;
  targets.sort((a,b) => {
    const da = Math.hypot(a.x - fromX, a.y - fromY);
    const db = Math.hypot(b.x - fromX, b.y - fromY);
    return da - db;
  });
  const target = targets[Math.floor(Math.random() * Math.min(2, targets.length))];

  eyesM.el.classList.add('puffing');
  setTimeout(() => eyesM.el.classList.remove('puffing'), 650);
  spitSound();

  const fieldRect = field.getBoundingClientRect();
  const fx = (fromX / 100) * fieldRect.width;
  const fy = (fromY / 100) * fieldRect.height;
  const tx = (target.x / 100) * fieldRect.width;
  const ty = (target.y / 100) * fieldRect.height;

  const proj = document.createElement('div');
  proj.className = 'spit-glob';
  proj.style.left = fx + 'px';
  proj.style.top  = fy + 'px';
  field.appendChild(proj);

  requestAnimationFrame(() => {
    proj.style.left = tx + 'px';
    proj.style.top  = ty + 'px';
  });

  setTimeout(() => {
    proj.remove();
    const splat = document.createElement('div');
    splat.className = 'spit-splat';
    splat.style.left = tx + 'px';
    splat.style.top  = ty + 'px';
    field.appendChild(splat);
    setTimeout(() => splat.remove(), 900);

    if(target && document.body.contains(target.el)){
      mushroomFlee(target, `Глазастый плюнул в гриб!`);
      beep(400,.1,'square',.04);
    }
  }, 600);

  if(Math.random() < 0.5){
    toast('💦 Глазастый гриб плюнул в гриб!', '#ffd75e', 'critic');
  }
}

   СЛИЗНИ
   ========================================================= */
const MAX_SLUGS = 2;
let slugs = [];
const slugData = new Map();
let slugRAF = null;

function spawnSlug(){
  if(slugs.length >= MAX_SLUGS || state.modalOpen) return;

  const id = ++state.mushId;
  const x = Math.random() < 0.5 ? rnd(8, 14) : rnd(86, 92);
  const y = rnd(35, 78);

  const el = document.createElement('div');
  el.className = 'slug';
  el.style.left = x + '%';
  el.style.top  = y + '%';
  el.style.zIndex = Math.round(y * 0.25) + 3;
  el.style.animationDelay = (Math.random()*0.2)+'s';
  el.innerHTML = slugSVG(id);

  const slug = { id, el, x, y };
  field.appendChild(el);
  slugs.push(slug);

  const angle = Math.random() * Math.PI * 2;
  slugData.set(id, {
    dirX: Math.cos(angle), dirY: Math.sin(angle),
    speed: 0.45 + Math.random() * 0.5,
    turnTimer: 80 + Math.floor(Math.random()*120),
    scareCooldown: 90,
  });

  if(!slugRAF) slugRAF = requestAnimationFrame(slugLoop);

  setTimeout(() => {
    if(!document.body.contains(el)) return;
    slug.el.classList.add('leaving');
    const i = slugs.indexOf(slug);
    if(i >= 0) slugs.splice(i, 1);
    slugData.delete(slug.id);
    setTimeout(()=> el.remove(), 900);
  }, 45000 + Math.random()*30000);
}

function slugLoop(){
  if(slugs.length === 0){ slugRAF = null; return; }

  const fieldRect = field.getBoundingClientRect();
  const W = fieldRect.width, H = fieldRect.height;

  for(const s of slugs){
    const d = slugData.get(s.id);
    if(!d) continue;

    let px = (s.x / 100) * W;
    let py = (s.y / 100) * H;
    px += d.dirX * d.speed;
    py += d.dirY * d.speed;

    const padX = 48, padTop = 100, padBottom = 25;
    if(px < padX){ px = padX; d.dirX = Math.abs(d.dirX); }
    if(px > W - padX){ px = W - padX; d.dirX = -Math.abs(d.dirX); }
    if(py < padTop){ py = padTop; d.dirY = Math.abs(d.dirY); }
    if(py > H - padBottom){ py = H - padBottom; d.dirY = -Math.abs(d.dirY); }

    const len = Math.hypot(d.dirX, d.dirY) || 1;
    d.dirX /= len; d.dirY /= len;

    d.turnTimer--;
    if(d.turnTimer <= 0){
      d.turnTimer = 80 + Math.floor(Math.random()*140);
      const a = Math.random() * Math.PI * 2;
      d.dirX = Math.cos(a); d.dirY = Math.sin(a);
    }

    s.x = (px / W) * 100;
    s.y = (py / H) * 100;
    s.el.style.left = s.x + '%';
    s.el.style.top  = s.y + '%';
    s.el.style.zIndex = Math.round(s.y * 0.25) + 3;

    if(d.scareCooldown > 0){ d.scareCooldown--; continue; }

    let victim = null;
    let minDist = 78;
    for(const other of mushrooms){
      if(other.isEyes || other.fleeing) continue;
      if(cast && cast.m === other) continue;
      const dx = ((other.x - s.x) / 100) * W;
      const dy = ((other.y - s.y) / 100) * H;
      const dist = Math.hypot(dx, dy);
      if(dist < minDist){ minDist = dist; victim = other; }
    }

    if(victim){
      mushroomFlee(victim, 'Слизень распугал грибы!');
      slugSound();
      d.scareCooldown = 100 + Math.floor(Math.random()*140);
    }
  }

  slugRAF = requestAnimationFrame(slugLoop);
}

/* =========================================================
   КАСТ-БАР
   ========================================================= */
let cast = null;
let rafId = null;

function startCast(m){
  if(cast) cancelCast(null, true);
  if(m.fleeing) return;

  const escape  = Math.random() < 0.06;
  const sturdy  = Math.random() < 0.14;
  const dur = sturdy ? rnd(2100, 3000) : rnd(1250, 2100);

  cast = { m, t0: performance.now(), dur,
    escapeAt: escape ? rnd(0.35, 0.72) : null, escaped: false };

  m.el.classList.add('casting');
  castEl.classList.add('show');
  castLabel.textContent = sturdy ? 'Крепкий гриб…' : 'Сбор гриба…';
  castFill.style.width = '0%';

  beep(180, .05, 'square', .02);
  rafId = requestAnimationFrame(castLoop);
}

function castLoop(){
  if(!cast) return;
  const now = performance.now();
  const p = Math.min(1, (now - cast.t0) / cast.dur);
  castFill.style.width = (p * 100) + '%';

  if(cast.escapeAt && !cast.escaped && p >= cast.escapeAt){
    cast.escaped = true;
    const m = cast.m;
    cancelCast(null, true);
    removeMushroom(m, true);
    toast('💨 Гриб вырвался и убежал!', '#ff7b7b');
    beep(120, .18, 'sawtooth', .04);
    return;
  }
  if(p >= 1){ finishCast(); return; }
  rafId = requestAnimationFrame(castLoop);
}

function cancelCast(msg, silent){
  if(!cast) return;
  cancelAnimationFrame(rafId);
  if(cast.m && cast.m.el) cast.m.el.classList.remove('casting');
  castEl.classList.remove('show');
  cast = null;
  if(msg && !silent) toast(msg, '#ffb020');
}

function rollLootCount(){
  let count = 1;
  if(Math.random() < 0.40) count++;
  if(Math.random() < 0.20) count++;
  if(Math.random() < 0.10) count++;
  if(Math.random() < 0.05) count++;
  return count;
}

function finishCast(){
  const m = cast.m;
  cancelAnimationFrame(rafId);
  m.el.classList.remove('casting');
  castEl.classList.remove('show');
  cast = null;

  removeMushroom(m, false);
  state.picks++;

  beep(520, .09, 'sine', .04);
  setTimeout(()=>beep(700, .1, 'sine', .035), 80);

  const isCrit = Math.random() < 0.10;
  let count = rollLootCount();
  if(isCrit) count = Math.min(10, count * 2);

  const items = [];
  for(let i=0;i<count;i++) items.push(rollItem());

  if(isCrit){
    toast(`✨ КРИТ! ${count} предметов!`, '#7bf0a4');
    flash('#7bf0a4');
  } else if(count >= 4){
    toast(`🍀 Щедрый гриб — ${count}!`, '#7de89a');
  }

  updateHud();
  openLoot(items, isCrit ? '✨ КРИТ! ДОБЫЧА' : `ДОБЫЧА · ${items.length} шт.`);

  if(Math.random() < 0.22){
    toast(TICKER[Math.floor(Math.random()*TICKER.length)]);
  }
}

function rollRarity(){
  let r;
  if(state.ritual > 0){
    state.ritual--;
    r = weightedPick({ rare:74, epic:22, legendary:3.5, mythic:0.5 });
    if(state.ritual === 0) toast('⭐ Ритуал закончился.', '#ffb020');
  } else if(state.pity >= PITY_MAX){
    r = weightedPick({ epic:82, legendary:15, mythic:3 });
  } else {
    r = weightedPick(BASE_WEIGHTS);
  }
  if(r === 'epic' || r === 'legendary' || r === 'mythic') state.pity = 0;
  else state.pity++;

  if(r === 'legendary') state.legendaries++;
  if(r === 'mythic')    state.mythics++;
  updateHud();
  return r;
}
function makeItem(rarity){
  const pool = ITEMS[rarity];
  const [name, icon, range] = pool[Math.floor(Math.random()*pool.length)];
  let value = rndI(range[0], range[1]);
  if(Math.random() < 0.12) value = Math.round(value * 1.6);
  return { name, icon, rarity, value };
}
function rollItem(){ return makeItem(rollRarity()); }

function openLoot(items, title){
  state.modalOpen = true;
  lootList.innerHTML = '';
  modalTitle.textContent = title || 'ДОБЫЧА';
  modalTotal.textContent = '';
  modalBack.classList.add('show');
  takeBtn.disabled = true;

  if(!items.length){
    const d = document.createElement('div');
    d.className = 'empty-msg';
    d.innerHTML = '💀 <b style="color:#ff7b7b">ПУСТО.</b><br>Попробуй ещё раз. Точно повезёт.';
    lootList.appendChild(d);
    setTimeout(()=>{ takeBtn.disabled = false; }, 350);
    return;
  }

  items.forEach(it => addToInventory(it));

  let total = 0;
  const stagger = items.length > 5 ? 130 : 200;

  items.forEach((it, idx) => {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'loot-item r-' + it.rarity;
      el.innerHTML = `
        <div class="li-icon" style="color:${RARITY[it.rarity].color}">${it.icon}</div>
        <div class="li-info">
          <div class="li-name">${it.name}</div>
          <div class="li-rar" style="color:${RARITY[it.rarity].color}">${RARITY[it.rarity].name}</div>
        </div>
        <div class="li-val">${fmt(it.value)} $</div>`;
      lootList.appendChild(el);
      lootList.scrollTop = lootList.scrollHeight;

      raritySound(it.rarity);
      total += it.value;

      if(it.rarity === 'legendary'){
        flash('#ffb020'); screenShake();
        toast('🔥 ЛЕГЕНДАРКА: ' + it.name, '#ffb020');
      }
      if(it.rarity === 'mythic'){
        flash('#ff3b3b'); screenShake();
        setTimeout(screenShake, 200);
        toast('🌌 МИФИК: ' + it.name, '#ff3b3b');
      }

      if(RARITY_ORDER.indexOf(it.rarity) > RARITY_ORDER.indexOf(state.bestRarity)){
        state.bestRarity = it.rarity;
        state.best = it.name;
        state.bestColor = RARITY[it.rarity].color;
        updateHud();
      }

      if(idx === items.length - 1){
        modalTotal.textContent = `ЦЕННОСТЬ (${items.length}): ${fmt(total)} $`;
        takeBtn.disabled = false;
      }
    }, 130 + idx * stagger);
  });
}

    toast(`💰 Продано за ${fmt(gained)} $`, '#ffd75e');
    beep(700, .1, 'triangle', .045);
    setTimeout(()=>beep(900, .12, 'triangle', .04), 100);
  }
});

profBtn.addEventListener('click', () => {
  if(state.modalOpen) return;
  state.modalOpen = true;
  renderProfile();
  profBack.classList.add('show');
  beep(700, .08, 'sine', .035);
});
lvlBadge.addEventListener('click', () => profBtn.click());
closeProfBtn.addEventListener('click', () => {
  profBack.classList.remove('show');
  state.modalOpen = false;
  beep(400, .06, 'sine', .03);
});
profBack.addEventListener('click', (e) => {
  if(e.target === profBack){
    profBack.classList.remove('show');
    state.modalOpen = false;
  }
});

/* =========================================================
   МАГАЗИН
   ========================================================= */
function spend(n){
  if(state.coins < n){
    toast('❌ Недостаточно (' + fmt(n) + ' $)', '#ff7b7b');
    beep(140, .15, 'square', .035);
    return false;
  }
  state.coins -= n;
  updateHud();
  return true;
}
document.getElementById('shopBox').addEventListener('click', () => {
  if(state.modalOpen) return;
  if(!spend(50)) return;
  beep(600, .1, 'triangle', .04);
  const n = 3 + Math.floor(Math.random()*3);
  const items = [];
  for(let i=0;i<n;i++) items.push(rollItem());
  openLoot(items, `🎁 ЯЩИК · ${n} шт.`);
});
document.getElementById('shopRitual').addEventListener('click', () => {
  if(state.modalOpen) return;
  if(!spend(120)) return;
  state.ritual = 3;
  toast('⭐ Ритуал! 3 сбора — мин. РЕДКИЙ.', '#ffb020');
  beep(700, .12, 'sine', .045);
  setTimeout(()=>beep(900, .16, 'sine', .045), 120);
  flash('#b45cff');
});
document.getElementById('shopRisk').addEventListener('click', () => {
  if(state.modalOpen) return;
  if(!spend(300)) return;
  beep(180, .2, 'sawtooth', .05);
  setTimeout(() => {
    if(Math.random() < 0.5){
      const it = makeItem('legendary');
      state.legendaries++;
      openLoot([it], '☠️ РИСК — ПОБЕДА!');
      toast('🔥 Ты выиграл!', '#ffb020');
    } else {
      openLoot([], '☠️ РИСК-ГРИБ');
      toast('💀 Проиграл 300 $.', '#ff7b7b');
    }
  }, 350);
});

field.addEventListener('click', (e) => {
  if(e.target.closest('.mush')) return;
  if(cast) cancelCast('Прервано');
});

/* =========================================================
   СПАВН
   ========================================================= */
function spawnLoop(){
  if(!state.modalOpen){
    spawnMushroom();
    if(Math.random() < 0.35) spawnMushroom();
  }
  setTimeout(spawnLoop, rnd(700, 1400));
}
function slugSpawnLoop(){
  if(!state.modalOpen) spawnSlug();
  setTimeout(slugSpawnLoop, rnd(18000, 32000));
}

for(let i=0;i<8;i++) setTimeout(spawnMushroom, i*100);
setTimeout(spawnEyesMushroom, 900);

setTimeout(spawnLoop, 1200);
setTimeout(spawnSlug, 8000);
setTimeout(slugSpawnLoop, 22000);

setTimeout(()=>toast('Кликай по грибам!', '#4ade80'), 600);
setTimeout(()=>toast('За сбор выпадает 1–5 предметов.', '#7de89a'), 4200);
setTimeout(()=>toast('🐌 Слизни распугивают грибы.', '#b06ad0'), 8500);
setTimeout(()=>toast('👁️ Глазастый гриб критикует и плюётся.', '#ffd75e'), 12500);

updateHud();

/* Дополнительно: при повороте экрана — пересчитать положение грибов в допустимых границах */
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    // Подстройка позиций грибов под новые размеры
    mushrooms.forEach(m => {
      m.x = Math.max(10, Math.min(90, m.x));
      m.y = Math.max(22, Math.min(86, m.y));
      m.el.style.left = m.x + '%';
      m.el.style.top  = m.y + '%';
    });
  }, 300);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>✨ Neon.io - Cool Visual IO Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12}
body{font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;top:20px;left:20px;color:#fff;font-size:14px;z-index:100;text-shadow:0 0 10px rgba(0,255,255,.8)}
#score{font-size:24px;font-weight:bold;color:#0ff;text-shadow:0 0 20px rgba(0,255,255,1)}
#leaderboard{position:fixed;top:20px;right:20px;background:rgba(0,0,0,.6);padding:15px;border-radius:10px;color:#fff;z-index:100;border:1px solid rgba(0,255,255,.3);backdrop-filter:blur(5px);min-width:150px}
#leaderboard h3{margin-bottom:10px;color:#0ff;text-align:center;text-shadow:0 0 10px rgba(0,255,255,.8);font-size:14px}
.leader-entry{display:flex;justify-content:space-between;margin:5px 0;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.leader-entry:last-child{border-bottom:none}
.leader-entry.me{color:#0ff;font-weight:bold}
#startScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a12 0%,#1a0a2e 50%,#0a1a2e 100%);z-index:1000}
#startScreen h1{font-size:48px;color:#fff;margin-bottom:10px;text-shadow:0 0 30px rgba(0,255,255,1),0 0 60px rgba(255,0,255,.5);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#startScreen p{color:#aaa;margin-bottom:30px;font-size:16px}
#startBtn{padding:15px 50px;font-size:20px;background:linear-gradient(135deg,#0ff,#f0f);border:none;border-radius:30px;color:#fff;cursor:pointer;font-weight:bold;box-shadow:0 0 30px rgba(0,255,255,.5),0 0 60px rgba(255,0,255,.3);transition:.3s}
#startBtn:hover{transform:scale(1.1);box-shadow:0 0 50px rgba(0,255,255,.8),0 0 100px rgba(255,0,255,.5)}
#minimap{position:fixed;bottom:20px;right:20px;width:150px;height:150px;background:rgba(0,0,0,.7);border:2px solid rgba(0,255,255,.3);border-radius:50%;z-index:100;overflow:hidden}
#minimapCanvas{width:100%;height:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="startScreen">
<h1>✨ Neon.io ✨</h1>
<p>Move with your mouse • Collect orbs • Grow bigger • Dominate the arena!</p>
<button id="startBtn">PLAY NOW</button>
</div>
<div id="ui" class="hidden">
<div>Score: <span id="score">0</span></div>
<div style="margin-top:5px;color:#aaa;font-size:12px">Mass: <span id="mass">10</span></div>
</div>
<div id="leaderboard" class="hidden">
<h3>🏆 LEADERBOARD</h3>
<div id="leaderEntries"></div>
</div>
<div id="minimap" class="hidden"><canvas id="minimapCanvas" width="150" height="150"></canvas></div>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const minimapCanvas=document.getElementById('minimapCanvas');
const minimapCtx=minimapCanvas.getContext('2d');

let width,height,worldSize=3000;
const players=[];
const foods=[];
const particles=[];
const explosions=[];
let player;
let mouseX=0,mouseY=0;
let cameraX=0,cameraY=0;
let gameRunning=false;
let animationId;

// Color palettes
const colors=['#ff0066','#00ff88','#00ccff','#ffaa00','#ff00ff','#00ffff','#ff6600','#99ff00'];
const glowColors=['rgba(255,0,102,0.6)','rgba(0,255,136,0.6)','rgba(0,204,255,0.6)','rgba(255,170,0,0.6)','rgba(255,0,255,0.6)','rgba(0,255,255,0.6)','rgba(255,102,0,0.6)','rgba(153,255,0,0.6)'];

class Player{
constructor(x,y,name,isBot=true){
this.x=x;
this.y=y;
this.radius=15;
this.color=colors[Math.floor(Math.random()*colors.length)];
this.glowColor=glowColors[colors.indexOf(this.color)];
this.name=name||'Player';
this.isBot=isBot;
this.velocity={x:0,y:0};
this.speed=3;
this.trail=[];
this.maxTrail=20;
this.targetX=Math.random()*worldSize;
this.targetY=Math.random()*worldSize;
this.changeTargetTimer=0;
this.boosting=false;
this.particles=[];
}

update(){
// Trail effect
this.trail.push({x:this.x,y:this.y,radius:this.radius*0.8,alpha:0.6});
if(this.trail.length>this.maxTrail)this.trail.shift();
this.trail.forEach(t=>t.alpha-=0.03);

if(this.isBot){
this.botAI();
}else{
const angle=Math.atan2(mouseY+cameraY-this.y,mouseX+cameraX-this.x);
const speed=this.boosting?this.speed*1.5:this.speed;
this.velocity.x=Math.cos(angle)*speed;
this.velocity.y=Math.sin(angle)*speed;
}

this.x+=this.velocity.x;
this.y+=this.velocity.y;

// Boundary check
this.x=Math.max(this.radius,Math.min(worldSize-this.radius,this.x));
this.y=Math.max(this.radius,Math.min(worldSize-this.radius,this.y));

// Size based on score
const targetRadius=15+Math.sqrt(this.score||0)*0.5;
this.radius+=(targetRadius-this.radius)*0.05;
this.maxTrail=15+Math.floor(this.radius/5);

// Particles
if(Math.random()<0.3&&this.radius>20){
this.particles.push({
x:this.x+(Math.random()-0.5)*this.radius*2,
y:this.y+(Math.random()-0.5)*this.radius*2,
vx:(Math.random()-0.5)*2,
vy:(Math.random()-0.5)*2-1,
life:1,
color:this.color,
size:Math.random()*3+1
});
}
this.particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.vy+=0.05;
p.life-=0.03;
p.size*=0.98;
});
this.particles=this.particles.filter(p=>p.life>0);
}

botAI(){
this.changeTargetTimer--;
if(this.changeTargetTimer<=0){
this.targetX=Math.random()*worldSize;
this.targetY=Math.random()*worldSize;
this.changeTargetTimer=60+Math.random()*120;
}

// Seek food
let nearestFood=null;
let nearestDist=300;
foods.forEach(f=>{
const d=Math.hypot(f.x-this.x,f.y-this.y);
if(d<nearestDist){
nearestDist=d;
nearestFood=f;
}
});

if(nearestFood){
this.targetX=nearestFood.x;
this.targetY=nearestFood.y;
}

const angle=Math.atan2(this.targetY-this.y,this.targetX-this.x);
const dist=Math.hypot(this.targetX-this.x,this.targetY-this.y);
const speed=dist<50?this.speed*0.5:this.speed;
this.velocity.x=Math.cos(angle)*speed;
this.velocity.y=Math.sin(angle)*speed;
this.boosting=dist<100&&Math.random()<0.02;
}

draw(){
// Draw trail
this.trail.forEach((t,i)=>{
const alpha=t.alpha*(i/this.trail.length)*0.5;
ctx.beginPath();
ctx.arc(t.x,t.y,t.radius*alpha,0,Math.PI*2);
ctx.fillStyle=this.color;
ctx.globalAlpha=alpha;
ctx.fill();
ctx.globalAlpha=1;
});

// Draw particles
this.particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.globalAlpha=p.life;
ctx.fill();
ctx.globalAlpha=1;
});

// Draw glow
const gradient=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius*2);
gradient.addColorStop(0,this.glowColor);
gradient.addColorStop(1,'transparent');
ctx.fillStyle=gradient;
ctx.beginPath();
ctx.arc(this.x,this.y,this.radius*2,0,Math.PI*2);
ctx.fill();

// Draw body
ctx.beginPath();
ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
const bodyGrad=ctx.createRadialGradient(this.x-this.radius*0.3,this.y-this.radius*0.3,0,this.x,this.y,this.radius);
bodyGrad.addColorStop(0,'#ffffff');
bodyGrad.addColorStop(0.3,this.color);
bodyGrad.addColorStop(1,this.color);
ctx.fillStyle=bodyGrad;
ctx.fill();

// Draw border
ctx.strokeStyle='#ffffff';
ctx.lineWidth=3;
ctx.stroke();

// Draw name
if(!this.isBot||this.radius>25){
ctx.fillStyle='#fff';
ctx.font='bold 12px Segoe UI';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.shadowColor=this.color;
ctx.shadowBlur=10;
ctx.fillText(this.name,this.x,this.y-this.radius-15);
ctx.shadowBlur=0;
}
}

addScore(points){
this.score=(this.score||0)+points;
}
}

class Food{
constructor(x,y){
this.x=x||Math.random()*worldSize;
this.y=y||Math.random()*worldSize;
this.radius=5+Math.random()*5;
this.color=colors[Math.floor(Math.random()*colors.length)];
this.pulse=Math.random()*Math.PI*2;
this.value=Math.floor(this.radius);
}

update(){
this.pulse+=0.05;
}

draw(){
const pulseRadius=this.radius+Math.sin(this.pulse)*2;
const gradient=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,pulseRadius*2);
gradient.addColorStop(0,this.color);
gradient.addColorStop(0.5,this.color+'88');
gradient.addColorStop(1,'transparent');
ctx.fillStyle=gradient;
ctx.beginPath();
ctx.arc(this.x,this.y,pulseRadius*2,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(this.x,this.y,pulseRadius,0,Math.PI*2);
ctx.fillStyle=this.color;
ctx.fill();

ctx.beginPath();
ctx.arc(this.x-this.radius*0.3,this.y-this.radius*0.3,this.radius*0.4,0,Math.PI*2);
ctx.fillStyle='rgba(255,255,255,0.6)';
ctx.fill();
}
}

class Explosion{
constructor(x,y,color,size){
this.x=x;
this.y=y;
this.color=color;
this.size=size;
this.particles=[];
for(let i=0;i<20;i++){
this.particles.push({
angle:(Math.PI*2/20)*i,
speed:2+Math.random()*4,
radius:2+Math.random()*4,
life:1,
decay:0.02+Math.random()*0.03
});
}
}

update(){
this.particles.forEach(p=>{
p.x=this.x+Math.cos(p.angle)*p.speed;
p.y=this.y+Math.sin(p.angle)*p.speed;
p.life-=p.decay;
p.speed*=0.95;
});
this.particles=this.particles.filter(p=>p.life>0);
}

draw(){
this.particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.radius*p.life,0,Math.PI*2);
ctx.fillStyle=this.color;
ctx.globalAlpha=p.life;
ctx.fill();
ctx.globalAlpha=1;
});
}
}

function resize(){
width=canvas.width=window.innerWidth;
height=canvas.height=window.innerHeight;
}

function init(){
resize();
player=new Player(worldSize/2,worldSize/2,'You',false);
player.score=0;
players.length=0;
players.push(player);

// Create bots
for(let i=0;i<15;i++){
const bot=new Player(
Math.random()*worldSize,
Math.random()*worldSize,
'BOT_'+(i+1),
true
);
bot.score=Math.random()*100;
players.push(bot);
}

// Create food
foods.length=0;
for(let i=0;i<400;i++){
foods.push(new Food());
}

gameRunning=true;
document.getElementById('startScreen').classList.add('hidden');
document.getElementById('ui').classList.remove('hidden');
document.getElementById('leaderboard').classList.remove('hidden');
document.getElementById('minimap').classList.remove('hidden');

animate();
}

function drawGrid(){
const gridSize=50;
const offsetX=-cameraX%gridSize;
const offsetY=-cameraY%gridSize;

ctx.strokeStyle='rgba(0,255,255,0.05)';
ctx.lineWidth=1;

for(let x=offsetX;x<width;x+=gridSize){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,height);
ctx.stroke();
}

for(let y=offsetY;y<height;y+=gridSize){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(width,y);
ctx.stroke();
}

// World border
ctx.strokeStyle='rgba(255,0,255,0.3)';
ctx.lineWidth=5;
ctx.strokeRect(-cameraX,-cameraY,worldSize,worldSize);
}

function drawBackground(){
// Dark gradient background
const gradient=ctx.createRadialGradient(
width/2-cameraX*0.1,
height/2-cameraY*0.1,
0,
width/2,
height/2,
Math.max(width,height)
);
gradient.addColorStop(0,'#0a0a12');
gradient.addColorStop(0.5,'#0f0f1a');
gradient.addColorStop(1,'#05050a');
ctx.fillStyle=gradient;
ctx.fillRect(0,0,width,height);
}

function updateCamera(){
cameraX=player.x-width/2;
cameraY=player.y-height/2;
}

function checkCollisions(){
players.forEach(p=>{
foods.forEach((f,index)=>{
const dist=Math.hypot(p.x-f.x,p.y-f.y);
if(dist<p.radius+f.radius){
foods.splice(index,1);
foods.push(new Food());
p.addScore(f.value);

// Spawn particles
for(let i=0;i<5;i++){
particles.push({
x:f.x,
y:f.y,
vx:(Math.random()-0.5)*5,
vy:(Math.random()-0.5)*5,
life:1,
color:f.color,
size:Math.random()*3+1
});
}
}
});

// Player vs Player collision
players.forEach(other=>{
if(p!==other){
const dist=Math.hypot(p.x-other.x,p.y-other.y);
if(dist<p.radius+other.radius&&p.radius>other.radius*1.2){
// Eat smaller player
const sizeDiff=p.radius-other.radius;
if(sizeDiff>5){
explosions.push(new Explosion(other.x,other.y,other.color,other.radius));
other.x=Math.random()*worldSize;
other.y=Math.random()*worldSize;
other.score=0;
other.radius=15;
p.addScore(Math.floor(other.score/2)+20);
}
}
}
});
});

// Update particles
particles.forEach((p,i)=>{
p.x+=p.vx;
p.y+=p.vy;
p.vy+=0.1;
p.life-=0.03;
if(p.life<=0)particles.splice(i,1);
});
}

function updateLeaderboard(){
const sorted=[...players].sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,10);
const entries=document.getElementById('leaderEntries');
entries.innerHTML=sorted.map((p,i)=>`
<div class="leader-entry ${p===player?'me':''}">
<span>${i+1}. ${p.name}</span>
<span>${Math.floor(p.score||0)}</span>
</div>
`).join('');
}

function drawMinimap(){
minimapCtx.fillStyle='rgba(0,0,0,0.8)';
minimapCtx.fillRect(0,0,150,150);

const scale=150/worldSize;

players.forEach(p=>{
minimapCtx.beginPath();
minimapCtx.arc(p.x*scale,p.y*scale,p===player?4:3,0,Math.PI*2);
minimapCtx.fillStyle=p===player?'#0ff':p.color;
minimapCtx.fill();
});
}

function animate(){
if(!gameRunning)return;

ctx.clearRect(0,0,width,height);

// Update
updateCamera();
checkCollisions();
players.forEach(p=>p.update());
foods.forEach(f=>f.update());
explosions.forEach(e=>e.update());
explosions=explosions.filter(e=>e.particles.length>0);

// Draw
drawBackground();
ctx.save();
ctx.translate(-cameraX,-cameraY);

drawGrid();
foods.forEach(f=>f.draw());
players.forEach(p=>p.draw());
explosions.forEach(e=>e.draw());

// Draw particles
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.globalAlpha=p.life;
ctx.fill();
ctx.globalAlpha=1;
});

ctx.restore();

// Update UI
document.getElementById('score').textContent=Math.floor(player.score||0);
document.getElementById('mass').textContent=Math.floor(player.radius*10)/10;
updateLeaderboard();
drawMinimap();

requestAnimationFrame(animate);
}

// Event listeners
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{
mouseX=e.clientX;
mouseY=e.clientY;
});

document.getElementById('startBtn').addEventListener('click',init);

// Touch support
window.addEventListener('touchmove',e=>{
e.preventDefault();
const touch=e.touches[0];
mouseX=touch.clientX;
mouseY=touch.clientY;
},{passive:false});

resize();
</script>
</body>
</html>
